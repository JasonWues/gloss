name: Package
on:
    push:
        branches: [master]
        tags-ignore: [updater]
permissions: write-all

jobs:
    change-version:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.outputstep.outputs.VERSION }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git
            - id: outputstep
              run: |
                  # Derived once and reused, rather than re-running `git describe`
                  # in every substitution below.
                  #
                  # Tags are the source of truth for the version, but they only
                  # exist on a checkout that has them: `actions/checkout` fetches
                  # from THIS repository, so a fork that never had the upstream
                  # tags pushed to it gets none, and `git describe --tags` exits
                  # with "fatal: No names found, cannot describe anything."
                  #
                  # A failing command substitution inside an assignment does not
                  # trip `set -e`, so the original form absorbed that into an empty
                  # VERSION and wrote `"version": ""` into both manifests. Fall
                  # back to what package.json already claims instead -- an
                  # untagged build still gets a coherent version, it just does not
                  # advance. Push the tags to this repo to get real ones.
                  VERSION=$(git describe --tags 2>/dev/null | sed 's/-[0-9]*-.*//g') || true
                  if [ -z "$VERSION" ]; then
                      VERSION=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' package.json | head -1)
                      echo "::warning::no tags in this checkout; falling back to the package.json version $VERSION"
                  fi
                  if [ -z "$VERSION" ]; then
                      echo "::error::could not determine a version from tags or package.json"
                      exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
            - name: Change Version
              env:
                  VERSION: ${{ steps.outputstep.outputs.VERSION }}
              run: |
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\",/g" package.json

                  # The trailing comma is not optional here. `version` is followed
                  # by `identifier` in tauri.conf.json, so writing the line without
                  # one left the file as invalid JSON -- and the `pnpm prettier
                  # --write .` step that all three build jobs run then died on it
                  # with "Unexpected token, expected ','", failing every release.
                  sed -i "s/\"version\":.*/\"version\": \"$VERSION\",/g" src-tauri/tauri.conf.json

                  sed -i "s/version = \"0.0.0\"/version = \"$VERSION\"/g" src-tauri/Cargo.toml

                  echo "$VERSION"

            - name: Upload Artifacts for Windows
              uses: actions/upload-artifact@v4
              with:
                  name: source
                  path: ./*
                  include-hidden-files: true
                  if-no-files-found: error

    build-extension:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Build Popclipext
              run: |
                  cd .scripts/popclip
                  bash ./build.sh
                  cd ../..
            - name: Build SnipDo
              run: |
                  cd .scripts/snipdo
                  bash ./build.sh
                  cd ../..
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: Gloss.popclipextz
                  path: .scripts/popclip/Gloss.popclipextz
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: gloss.pbar
                  path: .scripts/snipdo/gloss.pbar
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: .scripts/popclip/Gloss.popclipextz
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: .scripts/snipdo/gloss.pbar

    build-for-macos:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [macos-latest]
                target: [aarch64-apple-darwin, x86_64-apple-darwin]

        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Build and Package
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
                  APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
                  APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
                  APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
                  APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
                  APPLE_ID: ${{ secrets.APPLE_ID }}
                  APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
              run: |
                  # tauri-bundler decides to codesign on the mere PRESENCE of
                  # APPLE_CERTIFICATE, not on it having a value. A secret that
                  # does not exist still arrives as an empty string, which is
                  # "present", so it ran `security import` on an empty payload
                  # and died with SecKeychainItemImport. This fork has no Apple
                  # certificate, so drop the whole group when it is blank and
                  # let the bundler produce an unsigned .app.
                  if [ -z "$APPLE_CERTIFICATE" ]; then
                      echo "::warning::no APPLE_CERTIFICATE secret in this repository; building unsigned"
                      unset APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
                            APPLE_TEAM_ID APPLE_API_ISSUER APPLE_API_KEY APPLE_ID APPLE_PASSWORD
                  fi
                  pnpm tauri build --target ${{ matrix.target }}
                  sudo chmod +x src-tauri/resources/*
                  chmod +x src-tauri/resources/*
            - name: Change File Name
              if: matrix.target == 'aarch64-apple-darwin'
              run: |
                  sudo mv src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gloss.app.tar.gz src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gloss_${{needs.change-version.outputs.version}}_aarch64.app.tar.gz
                  sudo mv src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gloss.app.tar.gz.sig src-tauri/target/aarch64-apple-darwin/release/bundle/macos/Gloss_${{needs.change-version.outputs.version}}_aarch64.app.tar.gz.sig
            - name: Change File Name
              if: matrix.target == 'x86_64-apple-darwin'
              run: |
                  sudo mv src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Gloss.app.tar.gz src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Gloss_${{needs.change-version.outputs.version}}_x64.app.tar.gz
                  sudo mv src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Gloss.app.tar.gz.sig src-tauri/target/x86_64-apple-darwin/release/bundle/macos/Gloss_${{needs.change-version.outputs.version}}_x64.app.tar.gz.sig
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_dmg
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: macos_${{ matrix.target }}_updater
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app*

    build-for-windows:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Build and Package
              run: |
                  $env:TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_PRIVATE_KEY }}"
                  $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_KEY_PASSWORD }}"
                  pnpm tauri build -b nsis --target ${{ matrix.target }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-windows-fix-runtime:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [windows-latest]
                target: [x86_64-pc-windows-msvc, i686-pc-windows-msvc, aarch64-pc-windows-msvc]
                include:
                    - os: windows-latest
                      arch: x64
                      target: x86_64-pc-windows-msvc
                      toolchain: stable-x86_64-pc-windows-msvc
                    - os: windows-latest
                      arch: x86
                      target: i686-pc-windows-msvc
                      toolchain: stable-i686-pc-windows-msvc
                    - os: windows-latest
                      arch: arm64
                      target: aarch64-pc-windows-msvc
                      toolchain: stable-aarch64-pc-windows-msvc
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Install Rust Stable
              uses: dtolnay/rust-toolchain@stable
            - name: install dependencies
              run: |
                  rustup target add ${{ matrix.target }}
                  rustup toolchain install --force-non-host ${{ matrix.toolchain }}
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11
            - name: Install Dependencies
              run: pnpm install
            - name: Code Format
              run: pnpm prettier --write .
            - name: Download WebView2 Runtime
              run: |
                  invoke-webrequest -uri https://github.com/westinyang/WebView2RuntimeArchive/releases/download/109.0.1518.78/Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -outfile Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab
                  Expand .\Microsoft.WebView2.FixedVersionRuntime.109.0.1518.78.${{ matrix.arch }}.cab -F:* ./src-tauri
                  Remove-Item .\src-tauri\tauri.windows.conf.json
                  Rename-Item .\src-tauri\webview.${{ matrix.arch }}.json tauri.windows.conf.json
            - name: Build and Package
              run: |
                  $env:TAURI_SIGNING_PRIVATE_KEY="${{ secrets.TAURI_PRIVATE_KEY }}"
                  $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD="${{ secrets.TAURI_KEY_PASSWORD }}"
                  pnpm tauri build -b nsis --target ${{ matrix.target }}
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Gloss_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.exe Gloss_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.exe
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Gloss_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.nsis.zip Gloss_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.nsis.zip
                  Rename-Item .\src-tauri\target\${{ matrix.target }}\release\bundle\nsis\Gloss_${{needs.change-version.outputs.version}}_${{ matrix.arch }}-setup.nsis.zip.sig Gloss_${{needs.change-version.outputs.version}}_${{ matrix.arch }}_fix_webview2_runtime-setup.nsis.zip.sig
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: windows_fix_webview_runtime_${{ matrix.target }}
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*setup*

    build-for-linux:
        needs: change-version
        strategy:
            fail-fast: false
            matrix:
                platform: [ubuntu-latest]
                target:
                    [
                        x86_64-unknown-linux-gnu,
                        i686-unknown-linux-gnu,
                        aarch64-unknown-linux-gnu,
                        armv7-unknown-linux-gnueabihf,
                    ]
                include:
                    - os: ubuntu-latest
                      target: x86_64-unknown-linux-gnu
                      toolchain: stable-x86_64-unknown-linux-gnu
                    - os: ubuntu-latest
                      target: i686-unknown-linux-gnu
                      toolchain: stable-i686-unknown-linux-gnu
                    - os: ubuntu-latest
                      target: aarch64-unknown-linux-gnu
                      toolchain: stable-aarch64-unknown-linux-gnu
                    - os: ubuntu-latest
                      target: armv7-unknown-linux-gnueabihf
                      toolchain: stable-armv7-unknown-linux-gnueabihf
        runs-on: ${{ matrix.platform }}
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: source
            - name: Build for Linux
              uses: ./.github/actions/build-for-linux
              env:
                  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
              with:
                  target: ${{ matrix.target }}
                  toolchain: ${{ matrix.toolchain }}
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_deb
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
                  if-no-files-found: error
            - name: Upload Artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_rpm
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
                  if-no-files-found: error
            - name: Upload Artifacts
              if: matrix.target == 'x86_64-unknown-linux-gnu'
              uses: actions/upload-artifact@v4
              with:
                  name: linux_${{ matrix.target }}_appimage
                  path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
                  if-no-files-found: error
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags') && matrix.target == 'x86_64-unknown-linux-gnu'
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            - name: Upload Release
              if: startsWith(github.ref, 'refs/tags')
              uses: softprops/action-gh-release@v1
              with:
                  body_path: CHANGELOG
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

    release-update:
        needs: [build-for-macos, build-for-windows, build-for-linux, build-for-windows-fix-runtime]
        runs-on: ubuntu-latest
        if: startsWith(github.ref, 'refs/tags')
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Install git
              run: |
                  sudo apt-get update
                  sudo apt-get install -y git curl
            - name: Get Tag Name
              run: |
                  echo "VERSION=$(git describe --tags | sed 's/-[0-9]*-.*//g')" >> $GITHUB_ENV
                  echo "VERSION=$(git describe --tags | sed 's/-[0-9]*-.*//g')"
            # This job had no Setup Nodejs of its own and ran on whatever the
            # ubuntu-latest image happened to ship. It only fires on tags, so it
            # would have failed the same way the others just did, out of sight.
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11
            - name: pnpm install
              run: pnpm install
            - name: Release updater file
              run: |
                  pnpm run updater
                  pnpm run updater:fixRuntime
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            - name: Upload Release
              uses: softprops/action-gh-release@v1
              with:
                  body: ${{env.VERSION}}
                  tag_name: updater
                  token: ${{ secrets.GITHUB_TOKEN }}
                  files: |
                      update.json
                      update-fix-runtime.json
