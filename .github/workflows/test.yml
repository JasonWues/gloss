name: Test

# Separate from Package, which only runs on a push to master and rewrites the
# version fields in three manifests before it builds. Tests have to run on the
# pull request, before any of that.
on:
    push:
        branches: [master]
    pull_request:

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            # Before `setup-node`, which is the opposite of the obvious order.
            # `cache: pnpm` below asks pnpm where its store is, so pnpm has to
            # exist by then; with these the other way round setup-node fails
            # with "Unable to locate executable file: pnpm".
            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11

            # pnpm 11 refuses to run below Node 22.13, which is why the version
            # is pinned rather than taken from `latest`.
            - name: Install Node
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install

            # No cargo and no system libraries: everything here runs in Node, so
            # this job finishes in under a minute where a Tauri build takes tens
            # of them. The Rust side has no tests yet.
            #
            # No `prettier --check` step yet: 16 files in the repository do not
            # currently satisfy it -- the READMEs, index.html,
            # pnpm-workspace.yaml, the three webview manifests, two source files,
            # and the four generated `src-tauri/gen/schemas/*.json`, which should
            # be in a .prettierignore rather than formatted. Adding the gate means
            # doing that cleanup first, and a gate that is red on the day it lands
            # teaches everyone to ignore it.
            # Vite transpiles TypeScript with esbuild, which strips types without
            # checking them -- `vite build` will happily accept
            # `const x: number = 'nope'`. So nothing verified the `.ts` files in
            # this repository until this step existed. It is green on the day it
            # lands, which is the only reason it is worth adding: a gate that is
            # red from the start teaches everyone to ignore it.
            - name: Typecheck
              run: pnpm typecheck

            - name: Test
              run: pnpm test
