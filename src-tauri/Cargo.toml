[package]
name = "gloss"
version = "0.0.0"
description = "Gloss"
authors = ["JasonWues"]
license = "GPL-3.0-only"
repository = "https://github.com/JasonWues/gloss"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Only the settings that cost nothing to build. `strip` is a flag handed to the
# linker, so it does not change compile time at all.
#
# `lto` and `codegen-units = 1` are deliberately NOT set: they are the two that
# buy size with build time, and after the language models left there is only
# about 30MB of code for them to work on, so the trade is not worth it here.
# `panic = "abort"` is also left alone -- windows are created hidden and shown
# once the webview mounts, so aborting on a stray panic would strand an
# invisible window instead of surfacing an error.
[profile.release]
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

tauri = { version = "2", features = [ "protocol-asset", "tray-icon", "image-png", "image-ico", "devtools"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-fs = { version = "2", features = ["watch"] }
tauri-plugin-store = "2"
tauri-plugin-log = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
# Only registered under cfg(debug_assertions), see main.rs.
tauri-plugin-mcp-bridge = "0.12"
serde = { version = "1.0", features = ["derive"] }
# A fork of pot-app/Selection. It carries two things 1.2.0 does not: the Windows
# clipboard fallback watches the clipboard sequence number instead of sleeping a
# flat 100ms after synthesising Ctrl+C, and its `windows` dependency is 0.62,
# the same one this crate asks for -- 1.2.0 wanted 0.56, so the bindings were
# compiled twice into one binary.
#
# Still upstream's behaviour, and still wrong: the clipboard is restored one
# format deep, so a selection translate destroys copied HTML, RTF or a file list.
#
# No `rev` here -- the exact commit is pinned by Cargo.lock, which is what makes
# the build reproducible; naming it twice would only mean editing two places.
selection = { git = "https://github.com/JasonWues/Selection" }
serde_json = "1.0"
dirs = "6.0.0"
log = "0.4"
tiny_http = "0.12.0"
# `wgc` swaps the capture backend from GDI's BitBlt to Windows.Graphics.Capture.
# BitBlt is an SDR-only API with no colour space handling, so on an HDR desktop --
# which DWM composes in scRGB FP16, where values above SDR white are legal -- it
# blows the highlights out. WGC is the path Snipping Tool uses. It is also GPU
# side, so it should not be slower than the BitBlt it replaces.
xcap = { version = "0.9", features = ["wgc"] }
base64 = "0.23"
reqwest = { version = "0.12", features = ["json"] }
reqwest_dav = "0.1.15"
zip = "2.2.0"
walkdir = "2.5"
thiserror = "2.0"
font-kit = "0.14.2"
image = "0.25.4"
whatlang = "0.18.0"
# Watches the user's hotkey blocklist without shelling out to platform-specific
# process-list commands. Only process names are refreshed by hotkey_suppression.
# This release has MSRV 1.75; sysinfo 0.39 requires Rust 1.95.
sysinfo = { version = "=0.36.1", default-features = false, features = ["system"] }
percent-encoding = "2.3.2"
# Pinned to the version tauri-plugin-mcp-bridge already pulls in, so the two
# share one build instead of compiling tungstenite twice.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3.34"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4.45"
tokio = { version = "1.53.1", features = ["time"] }
tauri-plugin-opener = "2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
macos-accessibility-client = "0.0.1"

[target.'cfg(windows)'.dependencies]
windows = {version="0.62.2",features= ["Graphics_Imaging", "Media_Core", "Media_Ocr", "Media_SpeechSynthesis", "Foundation", "Foundation_Collections", "Globalization", "Storage", "Storage_Streams"] }
# Reads the Internet Settings proxy keys. Already in the tree via hyper-util,
# which is what reqwest itself uses to read the very same keys.
windows-registry = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
#openssl

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
